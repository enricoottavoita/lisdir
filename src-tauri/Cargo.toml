[package]
name = "lisdir"
version = "0.10.0"
edition = "2021"
description = "Fast file search bar for Windows: NTFS MFT index, live USN updates, SMB folders"
license = "MIT"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Security_Authorization", "Win32_UI_Input_KeyboardAndMouse"] }
