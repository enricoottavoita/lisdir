[package]
name = "lisdir"
version = "0.17.5"
edition = "2021"
description = "Fast search bar and app launcher for Windows: NTFS MFT index, live USN updates, network folders"
license = "MIT"

[build-dependencies]
embed-resource = "3"

[dependencies]
iroh = "1.4"
sha2 = "0.10"
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread"] }
windows-numerics = "0.3"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Time", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_System_SystemServices"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# libraries are built for size; lisdir's own code (the search loops) stays at full speed
[profile.release.package."*"]
opt-level = "s"
