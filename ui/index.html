<!doctype html>
<meta charset="utf-8">
<title>lisdir</title>
<style>
  :root { --bg:#1f2024; --fg:#e8e8ea; --dim:#8b8d94; --sel:#34363d; --line:#2e3036; --hl:#7aa7ff; }
  @media (prefers-color-scheme: light) { :root { --bg:#fafafa; --fg:#1d1d1f; --dim:#6b6e76; --sel:#e6e8ee; --line:#dcdde2; --hl:#1a56db; } }
  * { box-sizing:border-box }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px "Segoe UI",sans-serif; overflow:hidden }
  body { display:flex; flex-direction:column }
  #q { width:100%; padding:16px 18px; font:inherit; font-size:20px; color:inherit; background:transparent; border:0; border-bottom:1px solid var(--line); outline:0 }
  #list { flex:1; min-height:0; overflow-y:auto; margin:0; padding:6px; list-style:none }
  li { display:flex; align-items:center; gap:10px; padding:6px 12px; border-radius:6px; white-space:nowrap }
  li .ic { width:24px; height:24px; flex:none }
  li .tx { min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis }
  li .sz { flex:none; color:var(--dim); font-size:12px }
  li.sel { background:var(--sel) }
  li b { color:var(--hl); font-weight:600 }
  li small { display:block; color:var(--dim); font-size:12px; overflow:hidden; text-overflow:ellipsis }
  #menu { position:fixed; right:18px; min-width:240px; margin:0; padding:4px; list-style:none; background:var(--bg);
          border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 20px #0005 }
  #menu li:hover { background:var(--sel) }
  #menu .sz { margin-left:auto; padding-left:24px }
  #bar { flex:none; padding:8px 18px; color:var(--dim); font-size:12px; border-top:1px solid var(--line); background:var(--bg) }
</style>
<input id="q" placeholder="Search files and folders…" autofocus autocomplete="off" spellcheck="false">
<ul id="list"></ul>
<ul id="menu" hidden></ul>
<div id="bar"><span id="ver" style="float:right; margin-left:12px"></span><span id="st"></span> · <span id="hint"></span></div>
<script>
const { invoke } = window.__TAURI__.core;
const q = document.getElementById('q'), list = document.getElementById('list'), st = document.getElementById('st');
let hits = [], sel = 0, seq = 0, pollTimer;

// Interface language comes from the Rust side (Windows UI language), so the tray menu and this bar always agree.
const STR = {
  en: { ph: 'Search files, folders and apps…', app: 'Application', hint: '↑↓ select · Enter open · → or Ctrl+O actions · Esc close',
        hintRecent: 'Recent · ↑↓ select · Enter open · Del remove · Shift+Del clear all · Esc close',
        busy: 'Indexing…', items: n => n.toLocaleString() + ' items',
        down: 'Index service not running (tray menu → Install index service)',
        acts: { open: 'Open', folder: 'Show in folder', copy: 'Copy', cut: 'Cut', path: 'Copy path', openas: 'Open with…',
                terminal: 'Open terminal here', properties: 'Properties' }, key: k => k },
  it: { ph: 'Cerca file, cartelle e app…', app: 'Applicazione', hint: '↑↓ seleziona · Invio apri · → o Ctrl+O azioni · Esc chiudi',
        hintRecent: 'Recenti · ↑↓ seleziona · Invio apri · Canc rimuovi · Maiusc+Canc svuota tutto · Esc chiudi',
        busy: 'Indicizzazione…', items: n => n.toLocaleString() + ' elementi',
        down: 'Servizio di indicizzazione non attivo (menu icona → Installa servizio di indicizzazione)',
        acts: { open: 'Apri', folder: 'Mostra nella cartella', copy: 'Copia', cut: 'Taglia', path: 'Copia percorso',
                openas: 'Apri con…', terminal: 'Apri terminale qui', properties: 'Proprietà' },
        key: k => k.replace('Enter', 'Invio').replace('Shift', 'Maiusc') },
};
let S = STR.en;
function applyLang() {
  q.placeholder = S.ph;
  showHint();
}
// With nothing typed the list shows your recent items; say so, and how to remove one.
function showHint() {
  document.getElementById('hint').textContent = !q.value.trim() && hits.length ? S.hintRecent : S.hint;
}
applyLang();
invoke('lang').then(l => { S = STR[l] || STR.en; applyLang(); poll(); });

// One blob URL per icon key (file type), shared by every result of that type.
const iconCache = new Map();
function iconUrl(h) {
  let p = iconCache.get(h.icon);
  if (!p) {
    p = invoke('icon', { key: h.icon, path: h.path })
      .then(png => URL.createObjectURL(new Blob([png], { type: 'image/png' })))
      .catch(() => { iconCache.delete(h.icon); return ''; }); // don't remember failures: retry on the next render
    iconCache.set(h.icon, p);
  }
  return p;
}

// 1536 -> "1.5 KB". Binary units, like Explorer.
function fmtSize(n) {
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i && n < 10 ? n.toFixed(1) : Math.round(n)) + ' ' + u[i];
}

// The name with the letters the search matched in bold. Positions are code points, as in Rust.
function nameNode(h) {
  const frag = document.createDocumentFragment(), on = new Set(h.hl || []);
  let buf = '', bold = false;
  const flush = () => {
    if (!buf) return;
    if (bold) { const b = document.createElement('b'); b.textContent = buf; frag.append(b); } else frag.append(buf);
    buf = '';
  };
  Array.from(h.name).forEach((c, i) => { if (on.has(i) !== bold) { flush(); bold = !bold; } buf += c; });
  flush();
  return frag;
}

function render() {
  list.replaceChildren(...hits.map((h, i) => {
    const li = document.createElement('li');
    li.className = i === sel ? 'sel' : '';
    const img = document.createElement('img');
    img.className = 'ic';
    iconUrl(h).then(u => { if (u) img.src = u; else img.style.visibility = 'hidden'; });
    const tx = document.createElement('div');
    tx.className = 'tx';
    tx.append(nameNode(h));
    const s = document.createElement('small');
    s.textContent = h.app ? S.app : h.path;
    tx.append(s);
    li.append(img, tx);
    if (h.size > 0) {
      const sz = document.createElement('span');
      sz.className = 'sz';
      sz.textContent = fmtSize(h.size);
      li.append(sz);
    }
    li.onclick = () => go(i, false);
    li.oncontextmenu = e => { e.preventDefault(); sel = i; menu = 0; render(); };
    return li;
  }));
  list.children[sel]?.scrollIntoView({ block: 'nearest' });
  showMenu();
}

// The action menu on the selected result, and the shortcut for each action (they work with the menu closed too).
const ACTS = [['open', 'Enter'], ['folder', 'Ctrl+Enter'], ['copy', 'Ctrl+C'], ['cut', 'Ctrl+X'], ['path', 'Ctrl+Shift+C'],
              ['openas', ''], ['terminal', 'Ctrl+T'], ['properties', 'Alt+Enter']];
const mn = document.getElementById('menu');
let menu = -1; // highlighted menu row; -1 = closed
function showMenu() {
  const row = list.children[sel];
  if (menu < 0 || !row || hits[sel].app) { menu = -1; mn.hidden = true; return; } // apps only open
  mn.replaceChildren(...ACTS.map(([a, k], i) => {
    const li = document.createElement('li');
    li.className = i === menu ? 'sel' : '';
    li.append(S.acts[a]);
    if (k) { const s = document.createElement('span'); s.className = 'sz'; s.textContent = S.key(k); li.append(s); }
    li.onmousedown = e => { e.preventDefault(); act(a); }; // mousedown keeps the focus in the box
    return li;
  }));
  mn.hidden = false;
  const r = row.getBoundingClientRect(), h = mn.offsetHeight; // below the row, or above it if it does not fit
  mn.style.top = (r.bottom + h <= innerHeight ? r.bottom : Math.max(0, r.top - h)) + 'px';
}
function act(a) {
  const h = hits[sel];
  menu = -1; showMenu();
  if (a === 'open' || a === 'folder') return go(sel, a === 'folder');
  if (h && !h.app) invoke('act', { action: a, path: h.path, isDir: h.is_dir });
}
// The action a key combination stands for, if any. With text selected in the box, Ctrl+C / Ctrl+X edit the text.
function keyAct(e) {
  if (e.key === 'Enter') return e.altKey ? 'properties' : e.ctrlKey ? 'folder' : 'open';
  if (!e.ctrlKey || e.altKey) return null;
  if (e.code === 'KeyT') return 'terminal';
  if (q.selectionStart !== q.selectionEnd) return null;
  return { KeyC: e.shiftKey ? 'path' : 'copy', KeyX: 'cut' }[e.code] ?? null;
}
document.onmousedown = e => { if (menu >= 0 && !mn.contains(e.target)) { menu = -1; showMenu(); } };
async function run(refresh) {
  const my = ++seq, r = await invoke('search', { q: q.value }), cur = hits[sel]?.path;
  if (my !== seq) return; // drop stale answers
  // a refresh while indexing keeps the selected item; typing starts again from the top
  const at = refresh === true && cur ? r.findIndex(h => h.path === cur) : -1;
  hits = r; sel = Math.max(at, 0); render(); showHint();
}
function go(i, folder) {
  const h = hits[i];
  if (!h || (h.app && folder)) return; // an app has no folder to reveal
  invoke('open', { path: h.path, folder, name: h.name, isDir: h.is_dir, app: !!h.app });
  invoke('hide');
}
async function poll() {
  const [busy, n, up] = await invoke('status');
  st.textContent = !up ? S.down : busy ? S.busy : S.items(n);
  clearTimeout(pollTimer); // one polling chain, however often the window regains focus
  if (busy || !up) pollTimer = setTimeout(poll, 1000);
  if (busy) run(true);
}

invoke('version').then(v => document.getElementById('ver').textContent = 'v' + v);
q.oninput = () => { menu = -1; run(); };
q.onkeydown = e => {
  const k = e.key, n = ACTS.length;
  if (menu >= 0 && (k === 'ArrowDown' || k === 'ArrowUp')) menu = (menu + (k === 'ArrowDown' ? 1 : n - 1)) % n;
  else if (menu >= 0 && k === 'Enter' && !e.ctrlKey && !e.altKey) { e.preventDefault(); return act(ACTS[menu][0]); }
  else if (menu >= 0 && (k === 'Escape' || k === 'ArrowLeft')) menu = -1;
  else if ((k === 'ArrowRight' && q.selectionEnd === q.value.length) || (e.ctrlKey && e.code === 'KeyO')) menu = 0;
  else if (k === 'ArrowDown') sel = Math.min(sel + 1, hits.length - 1);
  else if (k === 'ArrowUp') sel = Math.max(sel - 1, 0);
  else if (k === 'Escape') return invoke('hide');
  else if (e.key === 'Delete' && !q.value.trim()) { // forget a recent item, or all of them with Shift
    const h = hits[sel];
    if (h) invoke('forget', { path: e.shiftKey ? null : h.path }).then(run);
    return;
  }
  else if (keyAct(e)) { e.preventDefault(); return act(keyAct(e)); }
  else return;
  e.preventDefault(); render();
};
// Rust calls this each time the bar is shown. Keys typed in Explorer/Desktop were swallowed by the Rust hook and
// parked; claim them here. Otherwise a fresh open starts empty, which lists your recent items.
window.opened = async () => {
  menu = -1;
  poll();
  q.value = await invoke('take_pending');
  run();
  q.focus();
  setTimeout(async () => { // keys that raced the focus change
    const more = await invoke('take_pending');
    if (more) { q.value += more; run(); }
  }, 150);
};
window.onfocus = () => q.focus();
poll();
</script>
